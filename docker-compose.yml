services:
  parking-api:
    image: ${IMAGE}
    ports:
      - "8000:8000"
    environment:
      PARKING_DB_PATH: /data/parking_lots.db
    volumes:
      - parking_db:/data
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1 
    entrypoint: ["sh", "-c"]
    command:
      - >
        mkdir -p /mlflow/artifacts &&
        exec mlflow server
        --host 0.0.0.0
        --port 5000
        --workers 1
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --artifacts-destination /mlflow/artifacts
        --serve-artifacts
        --allowed-hosts "mlflow:5000,localhost:5000,localhost:5001,127.0.0.1:5000,127.0.0.1:5001"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  parking_db:
  mlflow_data: