apiVersion: v1
kind: Service
metadata:
  name: parking-api
  namespace: parking
spec:
  type: NodePort
  selector:
    app: parking-api
  ports:
    - port: 8000          # порт сервиса внутри кластера
      targetPort: 8000    # порт контейнера
      nodePort: 30080     # порт снаружи, на каждой ноде
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-api
  namespace: parking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parking-api
  template:
    metadata:
      labels:
        app: parking-api
    spec:
      nodeSelector:
        role: app          # ← на worker-app
      containers:
        - name: parking-api
          image: ghcr.io/lesik248/smart-parking-lot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PARKING_DB_PATH
              value: /data/parking_lots.db
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: data
          emptyDir: {}